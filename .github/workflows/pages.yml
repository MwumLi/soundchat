name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署；新的推送取消排队中的旧任务，但不打断正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 跑测试（部署前必须绿）
        run: npm test

      - name: 构建单文件页面
        run: |
          node build.mjs
          cp dist/soundchat.html dist/index.html

      # 首次部署前，仓库必须先启用 Pages：
      #   Settings → Pages → Build and deployment → Source 选 **GitHub Actions**
      # 没启用的话这一步会报 "Get Pages site failed ... 404"。
      #
      # 想让它自动启用也可以，但 configure-pages 官方说明明确写了
      # enablement「requires a token other than GITHUB_TOKEN」——
      # 默认 token 权限不够。所以这里做成可选的：配了 PAGES_PAT 就自动启用，
      # 没配就用默认 token（需要你手动点一下上面那个开关）。
      - uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.PAGES_PAT || github.token }}
          enablement: ${{ secrets.PAGES_PAT != '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
