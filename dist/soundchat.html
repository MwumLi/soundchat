<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1115" />
    <title>声波聊天 · SoundChat（单文件版）</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --panel2: #1e222b;
        --line: #2a2f3a;
        --fg: #e8eaed;
        --dim: #9aa3b2;
        --accent: #4f9cf9;
        --ok: #3ecf8e;
        --warn: #f5a623;
        --err: #f26d6d;
        --me: #2b4a7d;
        --peer: #262b36;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        overflow: hidden;
      }
      header {
        flex: none;
        padding: 10px 14px calc(10px + env(safe-area-inset-top)) 14px;
        padding-top: calc(10px + env(safe-area-inset-top));
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .title { font-weight: 600; font-size: 15px; margin-right: auto; display: flex; align-items: center; gap: 7px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
      .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
      .dot.tx { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
      .dot.err { background: var(--err); }
      /* textarea 之前漏在这个选择器外面，导致底部输入框是浏览器默认的白底黑字等宽字体 */
      button, select, input, textarea {
        font: inherit;
        color: var(--fg);
        background: var(--panel2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 11px;
        outline: none;
      }
      ::placeholder { color: var(--dim); }
      button, select { cursor: pointer; }
      button:hover:not(:disabled), select:hover {
        background: #262b36;
        border-color: #3b4354;
      }
      button.primary:hover:not(:disabled) { background: #6aabff; border-color: #6aabff; }
      button.ghost:hover:not(:disabled) { background: rgba(255, 255, 255, 0.07); border-color: #3b4354; }
      button:active { transform: scale(0.97); }
      /* outline:none 去掉了鼠标点击的难看轮廓，但键盘操作必须能看见焦点在哪 */
      button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #07121f; font-weight: 600; }
      button.ghost { background: transparent; }
      button:disabled { opacity: 0.45; cursor: default; }
      select { padding: 6px 8px; }
      .sub { color: var(--dim); font-size: 12px; margin-top: 6px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

      #chat {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        -webkit-overflow-scrolling: touch;
      }
      .msg { max-width: 82%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; position: relative; }
      .msg .meta { font-size: 11px; color: var(--dim); margin-bottom: 3px; }
      .msg.me { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
      .msg.peer { align-self: flex-start; background: var(--peer); border-bottom-left-radius: 4px; }
      .msg.sys { align-self: center; background: transparent; color: var(--dim); font-size: 12px; max-width: 100%; text-align: center; padding: 2px 8px; }
      .msg.err { align-self: center; background: rgba(242,109,109,0.12); color: var(--err); font-size: 12px; max-width: 100%; text-align: center; }

      footer {
        flex: none;
        padding: 10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
        background: var(--panel);
        border-top: 1px solid var(--line);
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      #text {
        flex: 1 1 auto;
        resize: none;
        min-height: 40px;
        max-height: 120px;
        padding: 9px 11px;
        line-height: 1.4;
      }
      #send { flex: none; height: 40px; padding: 0 18px; }

      #logPanel { flex: none; max-height: 30dvh; overflow-y: auto; background: #0b0d11; border-top: 1px solid var(--line); font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 8px 12px; display: none; }
      #logPanel.show { display: block; }
      #logPanel div { color: var(--dim); }
      #logPanel .ok { color: var(--ok); }
      #logPanel .warn { color: var(--warn); }
      #logPanel .error { color: var(--err); }
      #logPanel .tx { color: var(--accent); }

      #meter { width: 60px; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
      #meterFill { height: 100%; width: 0%; background: var(--ok); transition: width 80ms linear; }
      #overlay {
        position: fixed; inset: 0; background: rgba(8,10,14,0.94); display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; z-index: 50;
      }
      #overlay.hide { display: none; }
      #overlay h1 { margin: 0; font-size: 20px; }
      #overlay p { margin: 0; color: var(--dim); max-width: 34em; font-size: 13px; line-height: 1.7; }
      .hint { color: var(--dim); font-size: 12px; }
      #selfTestResult {
        min-height: 1.5em;
        font-size: 13px;
        color: var(--dim);
        max-width: 32em;
      }
      #selfTestResult.ok { color: var(--ok); }
      #selfTestResult.err { color: var(--err); }
      .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); }
    </style>
  </head>
  <body>
    <header>
      <div class="row">
        <div class="title"><span class="dot" id="dot"></span>声波聊天</div>
        <select id="profile" title="传输档位"></select>
        <button class="ghost" id="btnPair">配对</button>
        <button class="ghost" id="btnLog">日志</button>
        <button class="ghost" id="btnClear">清空记录</button>
      </div>
      <div class="sub">
        <span id="statusText">未启动</span>
        <span class="pill" id="meText">我</span>
        <span class="pill" id="peerText">未配对</span>
        <span class="pill" id="rateText"></span>
        <span id="meter"><span id="meterFill"></span></span>
      </div>
    </header>

    <div id="chat"></div>
    <div id="logPanel"></div>

    <footer>
      <textarea id="text" placeholder="输入要发送的文字…" rows="1"></textarea>
      <button class="primary" id="send">发送</button>
    </footer>

    <div id="overlay">
      <h1>声波聊天</h1>
      <p>
        两台设备分别打开本页面，把音量调到合适大小，放在同一房间内（1–3 米），
        点下面的按钮开始。之后文字会通过扬声器 → 麦克风直接传输，<b>不需要局域网、不需要蓝牙、不需要联网</b>。
      </p>
      <p class="hint">
        需要授权麦克风。首次建议先用「自检」确认本机链路正常。<br />
        提示：iOS 必须通过 https:// 或 localhost 打开，file:// 下浏览器不给麦克风权限。
      </p>
      <button class="primary" id="btnStart" style="font-size: 16px; padding: 12px 28px">开始监听</button>
      <div class="row" style="justify-content: center">
        <button class="ghost" id="btnSelfTest">自检</button>
        <button class="ghost" id="btnWav">导出 WAV</button>
      </div>
      <div id="selfTestResult"></div>
    </div>

    <script>
(function () {
'use strict';
/* ==================== src/modem.js ==================== */
/**
 * modem.js — 声波调制解调器（连续相位 MFSK）
 *
 * 设计要点
 * --------
 * 1. 调制：16 音 MFSK，每符号 4 bit，连续相位（CPFSK）避免符号切换时的爆音与频谱扩散。
 *    音间隔 300~400 Hz，远大于符号率对应的 DFT 分辨率（约 47~94 Hz），对室内多径有较强容忍度。
 * 2. 同步：16 个符号的升调前导码 [0,1,2,...,15]，接收端在"符号能量列"上做二维搜索
 *    （起始位置 × 每符号采样数），再对前导码做精细二维搜索（位置 × 周期）。
 *    搜索"每符号采样数"是为了兼容收发两端采样率不一致（44.1k ↔ 48k，偏差 8.8%）。
 * 3. 帧结构：header(5B) + payload(0~200B) + CRC16(2B)，每字节拆成 2 个 4bit 符号。
 * 4. 解调：Hann 窗 Goertzel 音阶组 + 取最大，非相干检测，不需要载波恢复。
 *
 * 本文件是纯计算模块：不依赖 DOM、Web Audio、任何第三方库，可在 Node 中直接单测。
 */

/* ============================ 常量 ============================ */

/**
 * 帧类型（v2，见 docs/design.md）
 * 物理层只负责按 type 的 4 个 bit 编解码，具体语义由会话层定义。
 */
const FRAME = {
  BEACON: 0x1, // A→广播：宣告存在（nonce + 昵称），不含 PIN
  CONNECT_REQ: 0x2, // B→A：请求连接（PIN + 昵称）
  CONNECT_ACK: 0x3, // A→B：同意连接
  REJECT: 0x4, // A→B：拒绝（原因码）
  MSG: 0x5, // 双向：聊天正文
  ACK: 0x6, // 双向：停等确认
  BYE: 0x7, // 双向：主动断开
};

/** 帧类型的合法范围（帧头校验用） */
const FRAME_TYPE_MIN = 1;
const FRAME_TYPE_MAX = 7;

const VERSION = 1;
const HEADER_BYTES = 6; // ver|type, seq, src, dst, len, crc8(header)
const CRC_BYTES = 2;
const MAX_PAYLOAD = 200;

/** 传输档位：以「时间」而非「采样数」定义，从而与设备采样率解耦 */
const PROFILES = {
  robust: {
    key: 'robust',
    label: '稳健',
    symbolMs: 21.333, // 1024 @48k
    nTones: 16,
    toneBase: 1000,
    toneSpacing: 400, // 1000..7000 Hz
    desc: '抗混响/抗噪优先，约 23 B/s',
  },
  fast: {
    key: 'fast',
    label: '快速',
    symbolMs: 13.333, // 512 @48k
    nTones: 16,
    toneBase: 1000,
    toneSpacing: 400, // 1000..7000 Hz
    desc: '速度优先，约 31 B/s，混响容忍度略低于稳健档',
  },
};

const DEFAULT_PROFILE = 'robust';

/* ============================ CRC16-CCITT ============================ */

const CRC_TABLE = (() => {
  const t = new Uint16Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i << 8;
    for (let b = 0; b < 8; b++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xffff : (c << 1) & 0xffff;
    t[i] = c;
  }
  return t;
})();

const CRC8_TABLE = (() => {
  const t = new Uint8Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let b = 0; b < 8; b++) c = c & 0x80 ? ((c << 1) ^ 0x07) & 0xff : (c << 1) & 0xff;
    t[i] = c;
  }
  return t;
})();

/** CRC-8/ATM，用于保护帧头（帧头本身很短，必须有校验才能挡住假同步） */
function crc8(bytes) {
  let crc = 0;
  for (let i = 0; i < bytes.length; i++) crc = CRC8_TABLE[crc ^ bytes[i]];
  return crc;
}

function crc16ccitt(bytes) {
  let crc = 0xffff;
  for (let i = 0; i < bytes.length; i++) crc = ((crc << 8) ^ CRC_TABLE[((crc >> 8) ^ bytes[i]) & 0xff]) & 0xffff;
  return crc;
}

/* ============================ 文本 <-> 字节 ============================ */

const _enc = typeof TextEncoder !== 'undefined' ? new TextEncoder() : null;
const _dec = typeof TextDecoder !== 'undefined' ? new TextDecoder('utf-8', { fatal: false }) : null;

function textToBytes(s) {
  if (_enc) return _enc.encode(s);
  return Uint8Array.from(Buffer.from(s, 'utf8'));
}
function bytesToText(b) {
  if (_dec) return _dec.decode(b);
  return Buffer.from(b).toString('utf8');
}

/* ============================ 帧编解码 ============================ */

/**
 * 组装帧字节：header(5) + payload(len) + crc16(2)
 * @returns {Uint8Array}
 */
function buildFrame({ type, seq = 0, src = 0, dst = 0, payload = new Uint8Array(0) }) {
  if (payload.length > MAX_PAYLOAD) throw new Error(`payload 过长: ${payload.length} > ${MAX_PAYLOAD}`);
  const buf = new Uint8Array(HEADER_BYTES + payload.length + CRC_BYTES);
  buf[0] = ((VERSION & 0x0f) << 4) | (type & 0x0f);
  buf[1] = seq & 0xff;
  buf[2] = src & 0xff;
  buf[3] = dst & 0xff;
  buf[4] = payload.length;
  buf[5] = crc8(buf.subarray(0, 5));
  buf.set(payload, HEADER_BYTES);
  const crc = crc16ccitt(buf.subarray(0, HEADER_BYTES + payload.length));
  buf[HEADER_BYTES + payload.length] = (crc >> 8) & 0xff;
  buf[HEADER_BYTES + payload.length + 1] = crc & 0xff;
  return buf;
}

/** 解析帧字节，CRC 不符返回 null */
function parseFrame(bytes) {
  if (bytes.length < HEADER_BYTES + CRC_BYTES) return null;
  const ver = bytes[0] >> 4;
  const type = bytes[0] & 0x0f;
  const len = bytes[4];
  if (bytes[5] !== crc8(bytes.subarray(0, 5))) return null;
  if (bytes.length !== HEADER_BYTES + len + CRC_BYTES) return null;
  const body = bytes.subarray(0, HEADER_BYTES + len);
  const got = (bytes[HEADER_BYTES + len] << 8) | bytes[HEADER_BYTES + len + 1];
  if (crc16ccitt(body) !== got) return null;
  return {
    version: ver,
    type,
    seq: bytes[1],
    src: bytes[2],
    dst: bytes[3],
    payload: bytes.subarray(HEADER_BYTES, HEADER_BYTES + len),
  };
}

/* ============================ 调制 ============================ */

/** 每符号采样数（按给定采样率） */
function samplesPerSymbol(profile, fs) {
  return Math.max(32, Math.round((profile.symbolMs * fs) / 1000));
}

/** 该档位在给定采样率下的原始比特率（bit/s，含前导码与 CRC 开销之外的理论值） */
function rawBitrate(profile) {
  return (Math.log2(profile.nTones) / profile.symbolMs) * 1000;
}

/**
 * 生成一帧的音频波形（Float32Array，峰值 0.85）
 * @param {Uint8Array} frameBytes 由 buildFrame 产生的字节
 * @param {object} profile
 * @param {number} fs 采样率
 */
function modulate(frameBytes, profile, fs) {
  const sps = samplesPerSymbol(profile, fs);
  const nPre = profile.nTones;
  const nSym = nPre + frameBytes.length * 2;
  const out = new Float32Array(nSym * sps);
  const twoPi = Math.PI * 2;
  const dphiTab = new Float64Array(nPre);
  for (let t = 0; t < nPre; t++) dphiTab[t] = (twoPi * (profile.toneBase + t * profile.toneSpacing)) / fs;

  let phase = 0;
  let idx = 0;
  for (let s = 0; s < nSym; s++) {
    let tone;
    if (s < nPre) tone = s;
    else {
      const d = s - nPre;
      const b = frameBytes[d >> 1];
      tone = (d & 1) === 0 ? b >> 4 : b & 0x0f;
    }
    const dphi = dphiTab[tone];
    for (let n = 0; n < sps; n++) {
      out[idx++] = Math.sin(phase);
      phase += dphi;
      if (phase >= twoPi) phase -= twoPi;
    }
  }

  // 淡入必须极短：CPFSK 从相位 0 起振（sin0=0），本身没有爆音，
  // 而长淡入会削弱前导码第一个符号，把接收端的周期估计带偏。
  const fadeIn = Math.min(Math.round(0.001 * fs), Math.floor(sps / 8));
  for (let i = 0; i < fadeIn; i++) out[i] *= i / fadeIn;
  const fadeOut = Math.min(Math.round(0.005 * fs), Math.floor(sps / 4));
  for (let i = 0; i < fadeOut; i++) out[out.length - 1 - i] *= i / fadeOut;

  // 归一化
  let peak = 0;
  for (let i = 0; i < out.length; i++) {
    const a = out[i] < 0 ? -out[i] : out[i];
    if (a > peak) peak = a;
  }
  if (peak > 0) {
    const g = 0.85 / peak;
    for (let i = 0; i < out.length; i++) out[i] *= g;
  }
  return out;
}

/** 生成前导码的纯音序列（供调试/频谱查看） */
function preambleTones(profile) {
  return Array.from({ length: profile.nTones }, (_, i) => profile.toneBase + i * profile.toneSpacing);
}

/* ============================ 解调器 ============================ */

const NEED_MORE = Symbol('need-more');

/**
 * 流式声波接收机。
 *
 *   const rx = new AcousticReceiver(PROFILES.robust, ctx.sampleRate);
 *   const frames = rx.push(float32Chunk);   // 返回本次新解出的帧
 */
class AcousticReceiver {
  /**
   * @param {object} profile
   * @param {number} rxFs 接收端采样率
   * @param {object} [opts]
   * @param {number} [opts.threshold=0.42] 前导码归一化匹配分阈值
   * @param {number} [opts.energyGate=3000] 前导码单符号期望音能量下限（噪声门限）
   * @param {number} [opts.historySeconds=20] 环形缓冲保留时长
   */
  constructor(profile, rxFs, opts = {}) {
    this.profile = profile;
    this.fs = rxFs;
    this.nominalSps = (profile.symbolMs * rxFs) / 1000;
    this.hop = Math.max(8, Math.round(this.nominalSps / 8));
    this.winLen = Math.round(this.nominalSps);
    this.threshold = opts.threshold ?? 0.42;
    this.timingGain = opts.timingGain ?? 0.05; // 每符号最大定时修正（占符号比例）
    this.energyGate = opts.energyGate ?? 3000;
    this.historySeconds = opts.historySeconds ?? 20;

    this.cap = Math.ceil(rxFs * this.historySeconds);
    this.ring = new Float32Array(this.cap);
    this.written = 0;

    this.colAbs = []; // 每列窗口起始的绝对采样位置
    this.colE = []; // 每列 16 个音的能量
    this.colT = []; // 每列 16 个音的能量之和（预计算，加速前导码扫描）
    this.colNextAbs = 0;
    this.scanFrom = 0;
    this._pending = null; // 已粗定位、正在等数据到齐的帧

    // 音阶系数缓存
    this._coef = new Float64Array(profile.nTones);
    for (let t = 0; t < profile.nTones; t++) {
      this._coef[t] = 2 * Math.cos((2 * Math.PI * (profile.toneBase + t * profile.toneSpacing)) / rxFs);
    }
    this._bank = new Float64Array(profile.nTones);

    // 扫描参数
    this.maxSpan = Math.round(((profile.nTones - 1) * this.nominalSps * 1.085) / this.hop);
    this.acceptNeed = Math.ceil(profile.nTones * this.nominalSps * 1.085);
    this.lookback = Math.ceil((this.acceptNeed - this.winLen) / this.hop) + 4;
    this.cands = [];
    for (let k = 0.92; k <= 1.0851; k += 0.005) this.cands.push(this.nominalSps * k);
    this._tried = new Set();
    this.decodeFloor = 0; // 已解出的帧之前的列不再扫描，避免重复出帧
    this._hannCache = new Map();
    this._scratchCache = new Map();

    this.lastSignal = 0; // 最近一次扫描的最大列能量（UI 用）
    this.level = 0; // 最近一次 push 生成列的最大总能量，供载波侦听用
  }

  /**
   * 流结束（停止录音）时调用：把挂起等待的帧硬解一次。
   *
   * 必须要有这个：接收机在等「末符号数据到齐」，如果输入流刚好在帧尾结束、
   * 后面没有尾随静音，就永远等不到更多数据，帧会被无声丢掉。
   * @returns {Array<object>} 本次解出的帧
   */
  flush() {
    const out = [];
    for (let i = 0; i < 3; i++) {
      const pd = this._pending;
      if (!pd || pd.totalSyms <= 0) break;
      this._pending = null;
      const f = this._emitFrame(pd, true);
      if (f && f !== NEED_MORE) {
        out.push(f);
        break;
      }
      if (this._pending) continue;
      break;
    }
    this._pending = null;
    return out;
  }

  /** 清空缓冲（例如即将开始发射时调用，避免解到自己的声音） */
  reset() {
    this.ring.fill(0);
    this.written = 0;
    this.colAbs.length = 0;
    this.colE.length = 0;
    this.colT.length = 0;
    this.colNextAbs = 0;
    this.scanFrom = 0;
    this._pending = null;
    this._tried.clear();
    this.decodeFloor = 0;
    this.lastSignal = 0;
    this.level = 0;
  }

  /* ---------- 内部工具 ---------- */

  _scratch(len) {
    let b = this._scratchCache.get(len);
    if (!b) {
      b = new Float32Array(len);
      this._scratchCache.set(len, b);
    }
    return b;
  }

  _hann(len) {
    let w = this._hannCache.get(len);
    if (!w) {
      w = new Float64Array(len);
      for (let i = 0; i < len; i++) w[i] = 0.5 - 0.5 * Math.cos((2 * Math.PI * i) / (len - 1));
      this._hannCache.set(len, w);
    }
    return w;
  }

  /** 从环形缓冲读取 [abs, abs+len) 到 dst */
  _readInto(abs, len, dst) {
    const cap = this.cap;
    let p = abs % cap;
    if (p < 0) p += cap;
    const first = Math.min(len, cap - p);
    dst.set(this.ring.subarray(p, p + first), 0);
    if (first < len) dst.set(this.ring.subarray(0, len - first), first);
    return dst;
  }

  /** 以 center 为中心、长度 len 的窗内 16 个音的能量（Hann 窗 Goertzel） */
  _toneBank(center, len, windowed) {
    const P = this.profile;
    const start = Math.round(center - len / 2);
    const buf = this._readInto(start, len, this._scratch(len));
    const win = windowed ? this._hann(len) : null;
    const out = this._bank;
    for (let t = 0; t < P.nTones; t++) {
      const c = this._coef[t];
      let s1 = 0;
      let s2 = 0;
      if (win) {
        for (let i = 0; i < len; i++) {
          const s0 = buf[i] * win[i] + c * s1 - s2;
          s2 = s1;
          s1 = s0;
        }
      } else {
        for (let i = 0; i < len; i++) {
          const s0 = buf[i] + c * s1 - s2;
          s2 = s1;
          s1 = s0;
        }
      }
      out[t] = s1 * s1 + s2 * s2 - c * s1 * s2;
    }
    return out;
  }

  /**
   * 前导码归一化匹配分：期望音能量 / 全部音能量。
   *
   * winFrac 取接近 1（0.95）很关键：窗口几乎盖满整个符号，只有窗口完全落在符号内才拿满分，
   * 于是 (起始位置, 每符号采样数) 平面上的满分平台很窄，周期才估得准。
   * 取 0.7 会让平台宽到 ±0.15 符号，周期误差累积到帧尾就解不出来了。
   */
  _preambleScore(startAbs, sps, winFrac = 0.95) {
    const nPre = this.profile.nTones;
    const len = Math.max(16, Math.round(sps * winFrac));
    const half = len / 2;
    const lo = Math.max(0, this.written - this.cap + 2);
    let num = 0;
    let den = 0;
    for (let s = 0; s < nPre; s++) {
      const center = startAbs + (s + 0.5) * sps;
      if (center + half > this.written || center - half < lo) return -1;
      // 矩形窗：边缘不衰减，窗口稍微越界就会掺进邻符号的音，对周期误差更敏感
      const e = this._toneBank(center, len, false);
      let tot = 0;
      for (let t = 0; t < nPre; t++) tot += e[t];
      num += e[s];
      den += tot;
    }
    if (den <= 1e-12) return 0;
    this.lastSignal = Math.max(this.lastSignal, num / nPre);
    return num / den;
  }

  /* ---------- 主流程 ---------- */

  /**
   * 送入一段音频
   * @param {Float32Array} samples
   * @returns {Array<object>} 本次解出的帧
   */
  push(samples) {
    const n = samples.length;
    if (n === 0) return [];
    let p = this.written % this.cap;
    for (let i = 0; i < n; i++) {
      this.ring[p] = samples[i];
      p++;
      if (p === this.cap) p = 0;
    }
    this.written += n;

    // 生成新的符号能量列
    const maxStart = this.written - this.winLen;
    let lvl = 0;
    while (this.colNextAbs <= maxStart) {
      const e = Float64Array.from(this._toneBank(this.colNextAbs + this.winLen / 2, this.winLen, false));
      let tot = 0;
      for (let t = 0; t < e.length; t++) tot += e[t];
      this.colAbs.push(this.colNextAbs);
      this.colE.push(e);
      this.colT.push(tot);
      if (tot > lvl) lvl = tot;
      this.colNextAbs += this.hop;
    }
    this.level = lvl; // 没有新列时为 0，表示这段音频是静音

    // 淘汰过老的数据
    const minAbs = this.written - this.cap + this.winLen + 2;
    let drop = 0;
    while (drop < this.colAbs.length && this.colAbs[drop] < minAbs) drop++;
    if (drop > 0) {
      this.colAbs.splice(0, drop);
      this.colE.splice(0, drop);
      this.colT.splice(0, drop);
      // scanFrom / decodeFloor 都是「列下标」，淘汰后必须一起平移，
      // 否则长会话（环形缓冲转一圈以后）扫描起点会越界，再也解不出帧。
      this.scanFrom = Math.max(0, this.scanFrom - drop);
      this.decodeFloor = Math.max(0, this.decodeFloor - drop);
    }

    return this._tryDecode();
  }

  _tryDecode() {
    const out = [];
    for (let guard = 0; guard < 4; guard++) {
      const f = this._scan();
      if (!f || f === NEED_MORE) break;
      out.push(f);
    }
    return out;
  }

  /**
   * 扫描流程：
   *   粗搜（符号能量列 + 周期候选） → 精细定位（前导码二维搜索）
   *   → 解 header 并校验 → 等整帧到齐 → 解调 + CRC
   */
  _scan() {
    const P = this.profile;
    const nPre = P.nTones;
    const hop = this.hop;
    const nCols = this.colE.length;

    // 0) 已定位、在等整帧到齐 —— O(1) 返回
    if (this._pending) {
      const pd0 = this._pending;
      if (this.written < pd0.needWritten) {
        if (this.written < pd0.deadline) return NEED_MORE;
        // 等太久（对端中途停了）。若最低限度样本已够就硬解一次，否则不拉黑、回退窗口重扫
        this._pending = null;
        if (pd0.totalSyms > 0 && this.written >= this._minNeed(pd0)) return this._emitFrame(pd0);
        this.scanFrom = Math.max(this.decodeFloor, this.colE.length - this.maxSpan - this.lookback);
        return null;
      }
      this._pending = null;
      return pd0.headerPending ? this._afterHeader(pd0) : this._emitFrame(pd0);
    }

    if (nCols < this.maxSpan + 2) return null;

    // 扫描窗口必须回看 lookback 列：因为「列已生成」比「前导码整段可判定」早约 15 个符号，
    // 不回看就会把当时判定不了的真实前导码永久跳过。
    const windowStart = Math.max(0, nCols - this.maxSpan - this.lookback);
    const from = Math.max(this.decodeFloor, Math.max(0, Math.min(this.scanFrom, nCols - 1)));

    let best = null;
    for (let ci = 0; ci < this.cands.length; ci++) {
      const sps = this.cands[ci];
      const stepCols = sps / hop;
      const span = Math.round((nPre - 1) * stepCols);
      const last = nCols - 1 - span;
      for (let i = from; i <= last; i++) {
        if (this.colAbs[i] + this.acceptNeed > this.written) continue;
        if (this._tried.has(this.colAbs[i])) continue;
        let num = 0;
        let den = 0;
        for (let s = 0; s < nPre; s++) {
          const c = i + Math.round(s * stepCols);
          num += this.colE[c][s];
          den += this.colT[c];
        }
        // 只看平均能量。不要对每个前导符号单独设能量门：
        // 多径频率选择性深衰落会让个别符号整体掉下去，那样会误杀真实前导码。
        // 「锚定在静音段」的假匹配交给后面的 header 合法性校验挡住。
        if (num / nPre < this.energyGate) continue;
        const score = num / den;
        if (!best || score > best.score) best = { score, i, sps };
      }
    }

    if (!best || best.score < this.threshold * 0.75) {
      this.scanFrom = windowStart;
      return null;
    }

    const colAbsValue = this.colAbs[best.i];

    // 1) 精细定位（此时前导码已整段到齐）
    const fine = this._fineSearch(colAbsValue, best.sps);
    if (!fine || fine.score < this.threshold) return this._failCandidate(colAbsValue);

    // 2) 等 header 到齐后再解。精细定位只需前导码，但 header 在后面 10 个符号，
    //    不等齐就读会读到脏数据，解出 len=0 之类的假长度（实测踩过）。
    const pd = { colIdx: best.i, colAbsValue, startGuess: fine.start, sps: fine.sps, score: fine.score, totalSyms: 0 };
    const hdrSyms = HEADER_BYTES * 2;
    const headerNeed = Math.ceil(fine.start + (nPre + hdrSyms) * fine.sps);
    if (this.written < headerNeed) {
      this._pending = { ...pd, headerPending: true, needWritten: headerNeed, deadline: headerNeed + this.fs * 2 };
      return NEED_MORE;
    }
    return this._afterHeader(pd);
  }

  /**
   * header 到齐后：解 header、做合法性校验、算整帧长度。
   * header 自身没有校验码，垃圾长度会让接收机傻等十几秒，必须先挡住。
   */
  _afterHeader(pd) {
    const nPre = this.profile.nTones;
    const hdrSyms = HEADER_BYTES * 2;
    const hdr = unpackNibbles(this._demodSymbols(pd.startGuess, pd.sps, hdrSyms));
    const len = hdr[4];
    if (
      hdr[5] !== crc8(hdr.subarray(0, 5)) ||
      hdr[0] >> 4 !== VERSION ||
      (hdr[0] & 0x0f) < FRAME_TYPE_MIN ||
      (hdr[0] & 0x0f) > FRAME_TYPE_MAX ||
      len > MAX_PAYLOAD
    ) {
      return this._failCandidate(pd.colAbsValue);
    }
    const totalSyms = hdrSyms + len * 2 + CRC_BYTES * 2;
    const next = { ...pd, totalSyms, headerPending: false };
    const needWritten = this._needFor(pd.startGuess, nPre, totalSyms, pd.sps);
    if (this.written < needWritten) {
      this._pending = { ...next, needWritten, deadline: needWritten + this.fs * 2 };
      return NEED_MORE;
    }
    return this._emitFrame(next);
  }

  /** 整帧解调所需的最少样本（最后一个符号窗的下沿） */
  _minNeed(pd) {
    return pd.startGuess + (this.profile.nTones + pd.totalSyms - 0.15) * pd.sps;
  }

  /**
   * 首次尝试解调所需的样本数。
   *
   * 这里刻意「少等一点」：前导码估出的周期误差约 ±0.5%，432 个符号累积能差 2000+ 采样，
   * 按保守上界算会等到流结束都凑不齐（实测快速档 200B 就卡死在这）。
   * 所以先按估计值动手，CRC 不过再靠 retry 多等几个符号——自适应，两头都不误。
   */
  _needFor(startGuess, nPre, totalSyms, sps) {
    return Math.ceil(startGuess + (nPre + totalSyms - 0.15) * sps + sps);
  }

  /** 解调整帧并做 CRC 校验 */
  _emitFrame(pd, force = false) {
    const nPre = this.profile.nTones;
    if (!force && this.written < this._minNeed(pd)) {
      const need = this._needFor(pd.startGuess, nPre, pd.totalSyms, pd.sps);
      this._pending = { ...pd, needWritten: need, deadline: need + this.fs * 2 };
      return NEED_MORE;
    }
    const nib = this._demodSymbols(pd.startGuess, pd.sps, pd.totalSyms);
    const frame = parseFrame(unpackNibbles(nib));
    if (!frame) {
      // CRC 不过：可能只是末符号数据还没到齐，再多等几个符号重试；重试用尽才判失败
      const retries = pd.retries || 0;
      if (!force && retries < 4) {
        const need = this.written + Math.round(4 * pd.sps);
        this._pending = { ...pd, retries: retries + 1, needWritten: need, deadline: need + this.fs * 2 };
        return NEED_MORE;
      }
      return this._failCandidate(pd.colAbsValue);
    }

    const endAbs = pd.startGuess + (nPre + pd.totalSyms) * pd.sps;
    let nextCol = pd.colIdx + 1;
    while (nextCol < this.colAbs.length && this.colAbs[nextCol] < endAbs) nextCol++;

    // decodeFloor 保证已解出的帧不会被重复解出
    this.decodeFloor = nextCol;
    this.scanFrom = nextCol;
    return {
      ...frame,
      score: pd.score,
      snr: this._snrFromScore(pd.score),
      samples: endAbs - pd.startGuess,
      startAbs: pd.startGuess,
      sps: pd.sps,
    };
  }

  /** 候选判定失败：拉黑该列并回退扫描窗口，避免跳过附近的真实前导码 */
  _failCandidate(colAbsValue) {
    this._tried.add(colAbsValue);
    if (this._tried.size > 512) this._tried.clear();
    this.scanFrom = Math.max(this.decodeFloor, this.colE.length - this.maxSpan - this.lookback);
    return null;
  }

  /** 精细二维搜索：起始偏移 ±hop，周期 ±0.5% */
  _fineSearch(startGuess, spsGuess) {
    let best = { score: -1, start: startGuess, sps: spsGuess };
    const offStep = Math.max(4, Math.round(this.hop / 4));
    const spsStep = spsGuess * 0.0005;
    for (let d = -10; d <= 10; d++) {
      const sps = spsGuess + d * spsStep;
      for (let o = -this.hop; o <= this.hop; o += offStep) {
        const sc = this._preambleScore(startGuess + o, sps);
        if (sc > best.score) best = { score: sc, start: startGuess + o, sps };
      }
    }
    return best.score < 0 ? null : best;
  }

  _snrFromScore(score) {
    const s = Math.min(0.995, Math.max(1e-6, score));
    return 10 * Math.log10(s / (1 - s)) - 10 * Math.log10(this.profile.nTones - 1);
  }

  /**
   * 逐符号解调，带有界 bang-bang 定时跟踪。
   *
   * 为什么必须跟踪：前导码只有 16 个符号，用它估出的每符号采样数误差约 0.5%，
   * 一个 400 符号的长帧累积漂移能到 2 个符号，直接解废。
   *
   * 为什么不用连续早-晚门：能量-偏移曲线在符号中心是「平顶 + 三角」，
   * 偏得较远时 (E_late - E_early) 会反向，环路朝错误方向发散，
   * 实测会让解调整体跳一个符号。改成比较「当前中心 vs ±δ 处同一音的能量」，
   * 只朝更高的一侧走固定小步（≤5% 符号），天然有界、捕获范围大。
   */
  _demodSymbols(startAbs, sps, n) {
    const P = this.profile;
    const nPre = P.nTones;
    const len = Math.max(16, Math.round(sps * 0.7));
    const delta = Math.max(2, Math.round(sps * 0.22));
    const half = len / 2;
    const lo = Math.max(0, this.written - this.cap + 2);
    const maxStep = this.timingGain * sps;
    const out = new Uint8Array(n);
    let center = startAbs + (nPre + 0.5) * sps;

    for (let k = 0; k < n; k++) {
      const eC = this._toneBank(center, len, true);
      let bi = 0;
      let v0 = -1;
      for (let t = 0; t < P.nTones; t++) {
        if (eC[t] > v0) {
          v0 = eC[t];
          bi = t;
        }
      }
      out[k] = bi;

      const track = center + delta + half + 2 <= this.written && center - delta - half - 2 >= lo;
      let step = 0;
      if (track && v0 > 0) {
        const eM = this._toneBank(center - delta, len, true);
        const vM = eM[bi];
        const eP = this._toneBank(center + delta, len, true);
        const vP = eP[bi];
        if (vP > v0 * 1.05 && vP >= vM) step = 1;
        else if (vM > v0 * 1.05 && vM > vP) step = -1;
      }
      center += sps + step * maxStep;
    }
    return out;
  }
}

/* ============================ 辅助 ============================ */

/** 4bit 符号序列 -> 字节序列 */
function unpackNibbles(nib) {
  const out = new Uint8Array(Math.floor(nib.length / 2));
  for (let i = 0; i < out.length; i++) out[i] = ((nib[2 * i] & 0x0f) << 4) | (nib[2 * i + 1] & 0x0f);
  return out;
}

/** 字节序列 -> 4bit 符号序列 */
function packNibbles(bytes) {
  const out = new Uint8Array(bytes.length * 2);
  for (let i = 0; i < bytes.length; i++) {
    out[2 * i] = bytes[i] >> 4;
    out[2 * i + 1] = bytes[i] & 0x0f;
  }
  return out;
}

/** 一帧的符号数 */
function frameSymbols(profile, frameBytes) {
  return profile.nTones + frameBytes.length * 2;
}

/** 估算一帧的空中时长（秒） */
function frameDuration(profile, frameBytes) {
  return (frameSymbols(profile, frameBytes) * profile.symbolMs) / 1000;
}

/** 一帧的有效载荷吞吐（字节/秒，含前导码与 CRC 开销） */
function effectiveByteRate(profile, payloadBytes) {
  const f = buildFrame({ type: FRAME.MSG, payload: new Uint8Array(payloadBytes) });
  const d = frameDuration(profile, f);
  return payloadBytes / d;
}

/* ==================== src/protocol.js ==================== */
/**
 * protocol.js — 会话层 v2：广播 / 扫描 / 连接(PIN 授权) / 停等 ARQ
 *
 * 设计依据见 docs/design.md，这里只强调三个最容易做错的点：
 *
 * 1. 半双工推论：「一直广播」不能是「不间断发声」。
 *    自己发声期间我们会丢弃麦克风输入（否则会解到自己的声音），
 *    所以广播必须是 [发声 BEACON] → [静默窗口] 循环，
 *    否则 A 永远收不到 B 的连接请求。
 *
 * 2. B 借 A 的广播节奏发请求：A 的 BEACON 一结束就是它静默窗口的起点，
 *    B 解完 BEACON 的时刻约等于该起点。因此不需要任何时钟同步，
 *    B 每听到一次广播就发一次请求，天然落在窗口里。
 *
 * 3. PIN 只在 A 的屏幕上，绝不进入任何声波帧。
 *    并且必须限制错误次数（默认 3 次后停止广播），否则 4 位数字
 *    在同一房间几分钟就能被穷举完。
 */


{ FRAME };

/** 拒绝原因码 */
const REJECT = {
  PIN_WRONG: 1,
  NOT_BROADCASTING: 2,
  BUSY: 3,
};

const REJECT_TEXT = {
  1: 'pin-wrong',
  2: 'not-broadcasting',
  3: 'busy',
};

/** 界面状态（顶部状态行用；broadcasting/scanning 是并行的开关，见 statusInfo） */
const STATE = {
  IDLE: 'idle', // 静默监听
  TX: 'tx', // 正在发声
  WAIT_ACK: 'wait-ack', // 发完等确认
  CONNECTING: 'connecting', // 正在发起连接
};

const MAX_TEXT_BYTES = 4000;
const MAX_NAME_BYTES = 32;

const defaultTimers = {
  setTimeout: (fn, ms) => setTimeout(fn, ms),
  clearTimeout: (id) => clearTimeout(id),
};

/* ============================ 载荷编解码 ============================ */

function packName(name) {
  return textToBytes(name || '').subarray(0, MAX_NAME_BYTES);
}

function unpackName(buf, off) {
  if (off >= buf.length) return '';
  const len = buf[off];
  const end = Math.min(buf.length, off + 1 + len);
  return bytesToText(buf.subarray(off + 1, end));
}

function packU32(v) {
  return [(v >>> 24) & 0xff, (v >>> 16) & 0xff, (v >>> 8) & 0xff, v & 0xff];
}
function unpackU32(b, off) {
  if (!b || b.length < off + 4) return 0;
  return ((b[off] << 24) | (b[off + 1] << 16) | (b[off + 2] << 8) | b[off + 3]) >>> 0;
}

/* ============================ 会话 ============================ */

class ChatSession {
  /**
   * @param {object} o
   * @param {number} o.myId
   * @param {string} [o.myName]
   * @param {number} [o.nonce]   tab 级随机数（ID 撞车裁决用，nonce 大的让位）
   * @param {(bytes:Uint8Array)=>Promise<void>} o.transmit
   * @param {object} [o.timers]  可注入定时器（测试用虚拟时钟）
   * @param {()=>number} [o.now]
   * @param {()=>number} [o.rand]
   * @param {object} [o.opts]
   */
  constructor(o) {
    this.myId = o.myId & 0xff;
    this.myName = o.myName || `设备${this.myId}`;
    this.nonce = (o.nonce ?? Math.floor(Math.random() * 0xffffffff)) >>> 0;
    this.transmit = o.transmit;
    this.timers = o.timers || defaultTimers;
    this._now = o.now || (() => Date.now());
    this._rand = o.rand || Math.random;

    // 回调
    this.onLog = o.onLog || (() => {});
    this.onStatus = o.onStatus || (() => {});
    this.onDiscover = o.onDiscover || (() => {});
    this.onPin = o.onPin || (() => {});
    this.onPeer = o.onPeer || (() => {});
    this.onConnectResult = o.onConnectResult || (() => {});
    this.onMessage = o.onMessage || (() => {});
    this.onIdCollision = o.onIdCollision || (() => {});

    const op = o.opts || {};
    this.beaconGapMs = op.beaconGapMs ?? 2800; // 广播的静默窗口
    this.connectDelay = op.connectDelay ?? 300; // B 首次请求延迟
    this.connectJitter = op.connectJitter ?? 400; // 多台 B 之间的随机错开
    this.connectRetries = op.connectRetries ?? 3;
    this.connectTimeout = op.connectTimeout ?? 20000;
    this.maxPinErrors = op.maxPinErrors ?? 3;
    this.discoverTtl = op.discoverTtl ?? 30000;
    this.ackTimeout = op.ackTimeout ?? 3000;
    this.ackDelay = op.ackDelay ?? 450;
    this.maxRetries = op.maxRetries ?? 3;
    this.rxMsgTimeout = op.rxMsgTimeout ?? 30000;
    this.txJitter = op.txJitter ?? 350;
    this.deferMs = op.deferMs ?? 220;

    /* ---- 状态 ---- */
    this.state = STATE.IDLE;
    this.broadcasting = false;
    this.scanning = false;
    this.pin = null;
    this.pinErrors = 0;
    this.discovered = new Map(); // peerId -> {id,name,nonce,snr,at}
    this.peerId = 0;
    this.peerName = '';
    this.paired = false;
    this.activePeer = 0;
    this.connecting = null;
    this.carrierBusy = false;

    /* ---- 定时器 ---- */
    this.beaconTimer = null;
    this.connectTimer = null;
    this.connectAckTimer = null;
    this.ackTimer = null;
    this.deferTimer = null;
    this._lastTxEndAt = null; // null = 从未发过声

    /* ---- 发送 ---- */
    this.seq = 0;
    this.nextMsgId = 1;
    this.queue = [];
    this.current = null;
    this.retries = 0;
    this.txChain = Promise.resolve();

    /* ---- 接收 ---- */
    this.rxMsgs = new Map();
    this.seen = new Map();
  }

  /* ============================ 生命周期 ============================ */

  /** 开始使用：只开监听，不发声 */
  start() {
    this._scheduleTick();
    this._setState(STATE.IDLE);
    this._log('info', `就绪：id=${this.myId} 昵称="${this.myName}"（静默监听，不发声）`);
  }

  stop() {
    this.stopBroadcast('stop');
    this.stopScan();
    this.cancelConnect();
    if (this.ackTimer) this.timers.clearTimeout(this.ackTimer);
    if (this.deferTimer) this.timers.clearTimeout(this.deferTimer);
    this.ackTimer = null;
    this.deferTimer = null;
    if (this._tickTimer) {
      this.timers.clearTimeout(this._tickTimer);
      this._tickTimer = null;
    }
  }

  /* ============================ 广播（A 侧） ============================ */

  /** 开始广播：生成新 PIN，进入 [发声] → [静默] 循环 */
  startBroadcast() {
    if (this.broadcasting) return this.pin;
    this.pin = Math.floor(this._rand() * 10000) % 10000;
    this.pinErrors = 0;
    this.broadcasting = true;
    this.onPin(this.pin);
    this._log('info', `开始广播，PIN=${this.pad4(this.pin)}（只显示在本机屏幕上，不会进入声波）`);
    this._emitStatus();
    this._beaconLoop();
    return this.pin;
  }

  /** 停止广播：PIN 立即作废 */
  stopBroadcast(reason = 'user') {
    if (!this.broadcasting) return;
    this.broadcasting = false;
    if (this.beaconTimer) {
      this.timers.clearTimeout(this.beaconTimer);
      this.beaconTimer = null;
    }
    this.pin = null;
    this.pinErrors = 0;
    this.onPin(null);
    this._log('info', `停止广播（${reason}）`);
    this._emitStatus();
  }

  _beaconLoop() {
    if (!this.broadcasting || this.beaconTimer) return;
    // 信道忙（对端在发 / 自己在发）先让一让，避免叠音
    if (this.carrierBusy || this.current || this.state === STATE.TX) {
      this.beaconTimer = this.timers.setTimeout(() => {
        this.beaconTimer = null;
        this._beaconLoop();
      }, this.deferMs);
      return;
    }
    this._delayedSend(() => this._beaconFrame()).then(() => {
      if (!this.broadcasting) return;
      // 静默窗口：B 的连接请求要落在这里
      this.beaconTimer = this.timers.setTimeout(() => {
        this.beaconTimer = null;
        this._beaconLoop();
      }, this.beaconGapMs);
    });
  }

  _beaconFrame() {
    const name = packName(this.myName);
    const p = new Uint8Array(5 + name.length);
    p.set(packU32(this.nonce), 0);
    p[4] = name.length;
    p.set(name, 5);
    return buildFrame({ type: FRAME.BEACON, seq: this._nextSeq(), src: this.myId, dst: 0, payload: p });
  }

  /* ============================ 扫描（B 侧） ============================ */

  startScan() {
    if (this.scanning) return;
    this.scanning = true;
    this._log('info', '开始扫描可连接设备');
    this._emitDiscover();
    this._emitStatus();
  }

  stopScan() {
    if (!this.scanning) return;
    this.scanning = false;
    this._log('info', '停止扫描');
    this._emitStatus();
  }

  /** 可连接设备列表（按最后收到时间倒序） */
  get discoveredList() {
    return [...this.discovered.values()].sort((a, b) => b.at - a.at);
  }

  /* ============================ 连接（B 侧） ============================ */

  /**
   * 向已发现的设备发起连接
   * @param {number} peerId
   * @param {string|number} pin 对方屏幕上显示的 4 位数字
   */
  connect(peerId, pin) {
    const pinStr = String(pin ?? '').trim();
    if (!/^\d{4}$/.test(pinStr)) return { ok: false, reason: 'bad-pin' };
    const dev = this.discovered.get(peerId);
    if (!dev) return { ok: false, reason: 'not-found' };
    if (this.connecting) this.cancelConnect();

    const c = { peerId, pin: parseInt(pinStr, 10), name: dev.name, tries: 0, inflight: false };
    this.connecting = c;
    this._setState(STATE.CONNECTING);
    this._log('info', `正在连接「${c.name}」…`);
    // B 要等 A 的下一次广播再发请求，所以超时给足
    this.connectAckTimer = this.timers.setTimeout(() => this._failConnect('timeout'), this.connectTimeout);
    // 刚听到广播的话静默窗口可能还没过，可以立刻发
    if (this._now() - dev.at < 1500) this._scheduleConnectReq(c);
    return { ok: true };
  }

  cancelConnect() {
    if (!this.connecting) return;
    this.connecting = null;
    this._clearConnectTimers();
    if (this.state === STATE.CONNECTING) this._setState(STATE.IDLE);
    this._log('info', '已取消连接');
  }

  _scheduleConnectReq(c) {
    if (this.connecting !== c || c.inflight) return;
    c.inflight = true;
    const delay = this.connectDelay + Math.floor(this._rand() * this.connectJitter);
    this.connectTimer = this.timers.setTimeout(() => {
      if (this.connecting !== c) return;
      c.inflight = false;
      c.tries++;
      this._log('tx', `发送连接请求（第 ${c.tries}/${this.connectRetries} 次）`);
      this._delayedSend(() => this._connectReqFrame(c)).then(() => {
        if (this.connecting !== c) return;
        if (c.tries >= this.connectRetries) this._log('warn', `已尝试 ${c.tries} 次，继续等待对端回应…`);
      });
    }, delay);
  }

  _connectReqFrame(c) {
    const name = packName(this.myName);
    const p = new Uint8Array(3 + name.length);
    p[0] = (c.pin >> 8) & 0xff;
    p[1] = c.pin & 0xff;
    p[2] = name.length;
    p.set(name, 3);
    return buildFrame({ type: FRAME.CONNECT_REQ, seq: this._nextSeq(), src: this.myId, dst: c.peerId, payload: p });
  }

  _failConnect(reason) {
    const c = this.connecting;
    if (!c) return;
    this.connecting = null;
    this._clearConnectTimers();
    this._setState(STATE.IDLE);
    this._log('warn', `连接「${c.name}」失败：${reason}`);
    this.onConnectResult({ ok: false, reason, peerId: c.peerId, name: c.name });
  }

  _clearConnectTimers() {
    if (this.connectTimer) {
      this.timers.clearTimeout(this.connectTimer);
      this.connectTimer = null;
    }
    if (this.connectAckTimer) {
      this.timers.clearTimeout(this.connectAckTimer);
      this.connectAckTimer = null;
    }
  }

  /* ============================ 接收分发 ============================ */

  onFrame(frame) {
    // src 等于自己 = 「自己的回声」或「对端用了同一个设备 ID」。
    //
    // 用 nonce 精确区分，不要用「多久没发声」这种时间窗：
    // 广播时每约 3.8 秒就发一次，时间窗稍微给宽一点就会把真实的 ID 撞车
    // 误判成自己的回声而漏掉（实测踩过）。
    // 自己的 BEACON 里带的是自己的 nonce，对端的 nonce 一定不同。
    if (frame.src === this.myId) {
      if (frame.type === FRAME.BEACON) {
        const their = unpackU32(frame.payload, 0);
        if (their !== this.nonce) {
          if (their > this.nonce) {
            this.onIdCollision({ nonce: their, src: frame.src });
          } else {
            this._log('info', `对端也叫设备${frame.src}，但它 nonce 更小，由它让位`);
          }
        }
        // their === this.nonce → 确实是自己的回声，忽略
      }
      return;
    }
    if (frame.dst !== 0 && frame.dst !== this.myId) return;

    switch (frame.type) {
      case FRAME.BEACON:
        this._onBeacon(frame);
        break;
      case FRAME.CONNECT_REQ:
        this._onConnectReq(frame);
        break;
      case FRAME.CONNECT_ACK:
        this._onConnectAck(frame);
        break;
      case FRAME.REJECT:
        this._onReject(frame);
        break;
      case FRAME.MSG:
        this._onMsg(frame);
        break;
      case FRAME.ACK:
        this._onAck(frame);
        break;
      case FRAME.BYE:
        this._onBye(frame);
        break;
      default:
        this._log('warn', `未知帧类型 ${frame.type}`);
    }
  }

  _onBeacon(frame) {
    const nonce = unpackU32(frame.payload, 0);
    const name = unpackName(frame.payload, 4) || `设备${frame.src}`;
    const snr = frame.snr ?? 0;

    // 只有扫描中才记入列表 —— 用户明确要求"点了检测才显示"
    if (this.scanning) {
      const existed = this.discovered.has(frame.src);
      this.discovered.set(frame.src, { id: frame.src, name, nonce, snr, at: this._now() });
      if (!existed) this._log('rx', `发现设备「${name}」（信号 ${snr.toFixed(1)}dB）`);
      this._emitDiscover();
      this._scheduleTick();
    }

    // 正在连这台设备：借它刚结束的这次广播，把请求发进静默窗口
    const c = this.connecting;
    if (c && c.peerId === frame.src && !c.inflight && c.tries < this.connectRetries) {
      this._scheduleConnectReq(c);
    }
  }

  _onConnectReq(frame) {
    const pin = (frame.payload[0] << 8) | frame.payload[1];
    const name = unpackName(frame.payload, 2) || `设备${frame.src}`;

    if (!this.broadcasting) {
      this._log('warn', `「${name}」请求连接，但本机没在广播，已拒绝`);
      this._delayedSend(() => this._rejectFrame(frame.src, REJECT.NOT_BROADCASTING));
      return;
    }
    if (pin === this.pin) {
      this._log('ok', `「${name}」PIN 校验通过，接受连接`);
      this.stopBroadcast('connected');
      this._setPeer(frame.src, name);
      this._delayedSend(() => this._connectAckFrame(frame.src));
      return;
    }
    this.pinErrors++;
    this._log('warn', `「${name}」PIN 错误（${this.pinErrors}/${this.maxPinErrors}）`);
    this._delayedSend(() => this._rejectFrame(frame.src, REJECT.PIN_WRONG));
    if (this.pinErrors >= this.maxPinErrors) {
      this.stopBroadcast('pin-errors');
      this._log('error', `PIN 连续错误 ${this.maxPinErrors} 次，已自动停止广播（防暴力穷举）`);
    }
  }

  _onConnectAck(frame) {
    const c = this.connecting;
    if (!c || frame.src !== c.peerId) return;
    const name = unpackName(frame.payload, 0) || c.name;
    this.connecting = null;
    this._clearConnectTimers();
    this._log('ok', `已连接「${name}」`);
    this._setPeer(frame.src, name);
    this.onConnectResult({ ok: true, peerId: frame.src, name });
  }

  _onReject(frame) {
    const c = this.connecting;
    if (!c || frame.src !== c.peerId) return;
    const reason = REJECT_TEXT[frame.payload[0]] || 'refused';
    this.connecting = null;
    this._clearConnectTimers();
    this._setState(STATE.IDLE);
    this._log('warn', `连接「${c.name}」被拒绝：${reason}`);
    this.onConnectResult({ ok: false, reason, peerId: frame.src, name: c.name });
  }

  _connectAckFrame(dst) {
    const name = packName(this.myName);
    const p = new Uint8Array(1 + name.length);
    p[0] = name.length;
    p.set(name, 1);
    return buildFrame({ type: FRAME.CONNECT_ACK, seq: this._nextSeq(), src: this.myId, dst, payload: p });
  }

  _rejectFrame(dst, reason) {
    return buildFrame({
      type: FRAME.REJECT,
      seq: this._nextSeq(),
      src: this.myId,
      dst,
      payload: Uint8Array.from([reason & 0xff]),
    });
  }

  _setPeer(id, name) {
    this.peerId = id & 0xff;
    this.peerName = name || `设备${id}`;
    this.paired = true;
    this.activePeer = this.peerId;
    this._setState(STATE.IDLE);
    this.onPeer({ id: this.peerId, name: this.peerName });
    this._emitStatus();
  }

  /** 断开当前连接 */
  disconnect() {
    if (!this.paired) return;
    const dst = this.peerId;
    this._delayedSend(() =>
      buildFrame({ type: FRAME.BYE, seq: this._nextSeq(), src: this.myId, dst, payload: new Uint8Array(0) })
    );
    this._clearPeer();
  }

  _onBye(frame) {
    if (frame.src !== this.peerId) return;
    const name = this.peerName;
    this._log('info', `「${name}」已断开`);
    this._clearPeer();
    this.onConnectResult({ ok: false, reason: 'peer-left', name });
  }

  _clearPeer() {
    this.paired = false;
    this.peerId = 0;
    this.peerName = '';
    this.activePeer = 0;
    this._setState(STATE.IDLE);
    this._emitStatus();
  }

  /* ============================ 发送消息 ============================ */

  say(text) {
    if (!this.paired) return { ok: false, reason: 'no-peer' };
    const bytes = textToBytes(text);
    if (!bytes.length) return { ok: false, reason: 'empty' };
    if (bytes.length > MAX_TEXT_BYTES) return { ok: false, reason: 'too-long' };

    const msgId = this.nextMsgId++ & 0xffff;
    const chunks = [];
    for (let i = 0; i < bytes.length; i += MAX_PAYLOAD - 4) {
      chunks.push(bytes.subarray(i, Math.min(i + MAX_PAYLOAD - 4, bytes.length)));
    }
    for (let i = 0; i < chunks.length; i++) {
      this.queue.push({ msgId, chunk: i, total: chunks.length, data: chunks[i] });
    }
    this._log('tx', `排队发送 ${bytes.length} 字节 → ${chunks.length} 帧`);
    this._pump();
    return { ok: true, msgId, chunks: chunks.length };
  }

  get busy() {
    return this.state === STATE.TX || this.state === STATE.WAIT_ACK || this.queue.length > 0;
  }

  _pump() {
    if (this.current || !this.queue.length) {
      if (!this.current && !this.queue.length && this.state !== STATE.TX) this._setState(STATE.IDLE);
      return;
    }
    const job = this.queue.shift();
    this.current = { ...job, seq: this._nextSeq(), tries: 0 };
    const jitter = this.txJitter > 0 ? Math.floor(this._rand() * this.txJitter) : 0;
    if (jitter > 0) {
      this._log('info', `起发退避 ${jitter}ms`);
      this.timers.setTimeout(() => {
        if (this.current) this._sendCurrent();
      }, jitter);
    } else {
      this._sendCurrent();
    }
  }

  /** 载波侦听：对端正在发声时让行（半双工信道必须有人让） */
  setCarrierBusy(busy) {
    this.carrierBusy = !!busy;
  }

  _sendCurrent() {
    const job = this.current;
    if (!job) return;
    if (this.carrierBusy) {
      if (this.deferTimer) return;
      this._log('info', '信道忙（对端正在发），让行…');
      this.deferTimer = this.timers.setTimeout(() => {
        this.deferTimer = null;
        this._sendCurrent();
      }, this.deferMs);
      return;
    }
    const payload = new Uint8Array(4 + job.data.length);
    payload[0] = (job.msgId >> 8) & 0xff;
    payload[1] = job.msgId & 0xff;
    payload[2] = job.chunk;
    payload[3] = job.total;
    payload.set(job.data, 4);
    const bytes = buildFrame({ type: FRAME.MSG, seq: job.seq, src: this.myId, dst: this.peerId, payload });

    this._delayedSend(() => bytes).then(() => {
      if (this.current !== job) return;
      this._setState(STATE.WAIT_ACK);
      this._log('tx', `已发出分片 ${job.chunk + 1}/${job.total}（seq=${job.seq}，第 ${job.tries + 1} 次），等待确认…`);
      this.ackTimer = this.timers.setTimeout(() => this._onAckTimeout(), this.ackTimeout);
    });
  }

  _onAck(frame) {
    if (!this.current) return;
    const ackSeq = frame.payload.length >= 1 ? frame.payload[0] : frame.seq;
    if (ackSeq !== this.current.seq) {
      this._log('info', `ACK seq=${ackSeq} 与当前 ${this.current.seq} 不匹配，忽略`);
      return;
    }
    if (this.ackTimer) {
      this.timers.clearTimeout(this.ackTimer);
      this.ackTimer = null;
    }
    this._log('ok', `分片 ${this.current.chunk + 1}/${this.current.total} 已确认`);
    this.current = null;
    this.retries = 0;
    this._pump();
  }

  _onAckTimeout() {
    this.ackTimer = null;
    if (!this.current) return;
    this._log('warn', `等待确认超时（${this.ackTimeout}ms）`);
    this._retransmit();
  }

  _retransmit() {
    const job = this.current;
    if (!job) return;
    job.tries++;
    if (job.tries > this.maxRetries) {
      this._log('error', `分片 ${job.chunk + 1}/${job.total} 重传 ${this.maxRetries} 次仍无确认，放弃`);
      this.current = null;
      this.retries = 0;
      this._setState(STATE.IDLE);
      this.onConnectResult({ ok: false, reason: 'no-ack' });
      this._pump();
      return;
    }
    this._sendCurrent();
  }

  /* ============================ 接收消息 ============================ */

  _onMsg(frame) {
    if (frame.src !== this.peerId) {
      this._log('info', `收到非当前连接设备(${frame.src})的消息，已忽略`);
      return;
    }
    const p = frame.payload;
    if (p.length < 4) return;
    const msgId = (p[0] << 8) | p[1];
    const chunk = p[2];
    const total = p[3];
    const data = p.subarray(4);
    const key = `${frame.src}:${msgId}:${chunk}`;

    // 无论是否重复都要回 ACK：对端可能只是没收到上一次 ACK
    this._delayedSend(() => this._ackFrame(frame.seq), this.ackDelay);

    if (this.seen.has(key)) {
      this._log('info', `重复分片 ${msgId}#${chunk}，已忽略但补发 ACK`);
      return;
    }
    this.seen.set(key, this._now());
    if (this.seen.size > 400) this.seen.delete(this.seen.keys().next().value);

    let rec = this.rxMsgs.get(msgId);
    if (!rec) {
      rec = { total, parts: new Map(), at: this._now(), from: frame.src };
      this.rxMsgs.set(msgId, rec);
    }
    rec.parts.set(chunk, data);
    this._log('rx', `分片 ${chunk + 1}/${total}（msgId=${msgId}）`);

    if (rec.parts.size === rec.total) {
      const parts = [];
      for (let i = 0; i < rec.total; i++) parts.push(rec.parts.get(i) || new Uint8Array(0));
      const bytes = new Uint8Array(parts.reduce((a, b) => a + b.length, 0));
      let off = 0;
      for (const part of parts) {
        bytes.set(part, off);
        off += part.length;
      }
      this.rxMsgs.delete(msgId);
      this.onMessage({ from: frame.src, fromName: this.peerName, text: bytesToText(bytes), at: this._now() });
    }
  }

  _ackFrame(seq) {
    return buildFrame({
      type: FRAME.ACK,
      seq: this._nextSeq(),
      src: this.myId,
      dst: this.peerId,
      payload: Uint8Array.from([seq & 0xff]),
    });
  }

  /* ============================ 维护 ============================ */

  /**
   * 自调度清理。不能只依赖外部调用 tick()：
   * 忘了调就表现为「设备停了广播但列表里一直在」，实测踩过。
   */
  _scheduleTick() {
    if (this._tickTimer) return;
    this._tickTimer = this.timers.setTimeout(() => {
      this._tickTimer = null;
      this.tick();
      if (this.discovered.size || this.rxMsgs.size) this._scheduleTick();
    }, 2000);
  }

  /** 清理过期的发现项和收不全的消息（由 _scheduleTick 周期驱动） */
  tick(now = this._now()) {
    let changed = false;
    for (const [id, d] of this.discovered) {
      if (now - d.at > this.discoverTtl) {
        this.discovered.delete(id);
        changed = true;
      }
    }
    if (changed) this._emitDiscover();
    if (this.discovered.size || this.rxMsgs.size) this._scheduleTick();

    for (const [msgId, rec] of this.rxMsgs) {
      if (now - rec.at > this.rxMsgTimeout) {
        this._log('warn', `消息 ${msgId} 分片超时未收全（${rec.parts.size}/${rec.total}），丢弃`);
        this.rxMsgs.delete(msgId);
      }
    }
  }

  /* ============================ 内部工具 ============================ */

  /** 串行化发送，避免两帧音频叠在一起 */
  _delayedSend(makeFrame, delay = 0) {
    this.txChain = this.txChain
      .then(async () => {
        if (delay > 0) await new Promise((r) => this.timers.setTimeout(r, delay));
        const bytes = makeFrame();
        if (!bytes) return;
        await this._tx(bytes);
      })
      .catch((e) => this._log('error', `发送失败: ${e.message}`));
    return this.txChain;
  }

  async _tx(bytes) {
    this._setState(STATE.TX);
    try {
      await this.transmit(bytes);
    } finally {
      this._lastTxEndAt = this._now();
      if (this.state === STATE.TX) this._setState(STATE.IDLE);
    }
  }

  _nextSeq() {
    this.seq = (this.seq % 255) + 1;
    return this.seq;
  }

  pad4(n) {
    return String(n).padStart(4, '0');
  }

  statusInfo() {
    return {
      broadcasting: this.broadcasting,
      scanning: this.scanning,
      pin: this.pin,
      peer: this.peerName,
      peerId: this.peerId,
      paired: this.paired,
      connecting: this.connecting ? this.connecting.name : null,
      connectingTries: this.connecting ? this.connecting.tries : 0,
      discovered: this.discovered.size,
      queue: this.queue.length,
    };
  }

  _setState(s) {
    this.state = s;
    this.onStatus(s, this.statusInfo());
  }

  _emitStatus() {
    this.onStatus(this.state, this.statusInfo());
  }

  _emitDiscover() {
    this.onDiscover(this.discoveredList);
  }

  _log(level, text) {
    this.onLog({ level, text, at: this._now() });
  }
}

/* ==================== src/app.js ==================== */
/**
 * app.js — 浏览器端：Web Audio 收发 + 聊天界面
 *
 * 音频链路：
 *   发送：modulate() 生成 Float32 波形 → AudioBuffer → BufferSource → 扬声器
 *   接收：getUserMedia（关掉 AGC/降噪/回声消除）→ ScriptProcessor → AcousticReceiver → 帧 → ChatSession
 *
 * 半双工处理：
 *   自己发声期间直接丢弃麦克风输入，发完 reset() 接收机。
 *   否则会解到自己的声音，且载波侦听会被自己触发。
 */



/* ============================ DOM ============================ */

const $ = (id) => document.getElementById(id);
const el = {
  dot: $('dot'),
  profile: $('profile'),
  btnPair: $('btnPair'),
  btnLog: $('btnLog'),
  statusText: $('statusText'),
  meText: $('meText'),
  peerText: $('peerText'),
  rateText: $('rateText'),
  meterFill: $('meterFill'),
  chat: $('chat'),
  logPanel: $('logPanel'),
  text: $('text'),
  send: $('send'),
  overlay: $('overlay'),
  btnStart: $('btnStart'),
  btnClear: $('btnClear'),
  btnSelfTest: $('btnSelfTest'),
  selfTestResult: $('selfTestResult'),
  btnWav: $('btnWav'),
};

/* ============================ 配置 ============================ */

/** 载波侦听门限（归一化能量：满幅正弦 ≈ 0.72） */
const CARRIER_THRESHOLD = 0.05;
/** 麦克风增益（有些设备录音偏小） */
const MIC_GAIN = 1.0;

const state = {
  ctx: null,
  stream: null,
  rx: null,
  session: null,
  txActive: false,
  profileKey: localStorage.getItem('sc.profile') || DEFAULT_PROFILE,
  myId: 0,
  myName: '',
  lastTick: 0,
  lastClipWarn: 0,
  nonce: 0,
};

/* ============================ 工具 ============================ */

function localGet(k, d) {
  try {
    return localStorage.getItem(k) ?? d;
  } catch {
    return d;
  }
}
function localSet(k, v) {
  try {
    localStorage.setItem(k, v);
  } catch {
    /* 忽略 */
  }
}

/**
 * 两层身份：
 *   sc.id       localStorage   —— 这台机器的**持久身份**，跨 tab、跨会话稳定，
 *                                 聊天记录按它归属，所以不能每个 tab 换一个。
 *   sc.id.tab   sessionStorage —— 仅当本 tab 在 ID 撞车中"让位"时写入的临时覆盖。
 *
 * 为什么不直接用 sessionStorage 当身份：那样每开一个 tab 就是一台新设备，
 * 身份和历史都跟着碎掉。撞车问题改由 HELLO 里的 nonce 做无歧义裁决解决
 * （nonce 小的让位），这样既保住了持久身份，同机双开也不会互抢。
 */
function sessGet(k, d) {
  try {
    return sessionStorage.getItem(k) ?? d;
  } catch {
    return d;
  }
}
function sessSet(k, v) {
  try {
    sessionStorage.setItem(k, v);
  } catch {
    /* 忽略 */
  }
}

function fmtTime(ms) {
  const d = new Date(ms);
  return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}`;
}

/* ============================ 聊天记录持久化 ============================ */

const HISTORY_KEY = 'sc.history';
const HISTORY_MAX = 300;

function loadHistory() {
  try {
    const arr = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
    return Array.isArray(arr) ? arr : [];
  } catch {
    return [];
  }
}

function pushHistory(entry) {
  const h = loadHistory();
  h.push(entry);
  while (h.length > HISTORY_MAX) h.shift();
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(h));
  } catch {
    /* 配额满 / 隐私模式，忽略即可，不影响聊天 */
  }
}

function clearHistory() {
  try {
    localStorage.removeItem(HISTORY_KEY);
  } catch {
    /* 忽略 */
  }
}

/** 只渲染，不落盘 */
function renderMsg(kind, text, meta = '') {
  const div = document.createElement('div');
  div.className = `msg ${kind}`;
  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    div.appendChild(m);
  }
  div.appendChild(document.createTextNode(text));
  el.chat.appendChild(div);
  el.chat.scrollTop = el.chat.scrollHeight;
}

function addMsg(kind, text, meta = '', persist = true) {
  renderMsg(kind, text, meta);
  if (persist) pushHistory({ k: kind, t: text, m: meta, a: Date.now() });
}

function addLog(level, text) {
  const d = document.createElement('div');
  d.className = level;
  d.textContent = `${fmtTime(Date.now())}  ${text}`;
  el.logPanel.appendChild(d);
  while (el.logPanel.childElementCount > 400) el.logPanel.removeChild(el.logPanel.firstChild);
  el.logPanel.scrollTop = el.logPanel.scrollHeight;
}

const LEVEL_TEXT = {
  [STATE.IDLE]: '监听中',
  [STATE.TX]: '正在发声…',
  [STATE.WAIT_ACK]: '等待对端确认…',
  [STATE.PAIRING]: '配对中…',
  [STATE.BUSY]: '对端正在发…',
};

function setStatus(s, info = {}) {
  el.statusText.textContent = LEVEL_TEXT[s] || s;
  el.dot.className = 'dot';
  if (s === STATE.TX || s === STATE.WAIT_ACK) el.dot.classList.add('tx');
  else if (s === STATE.IDLE) el.dot.classList.add('on');
  if (info.error === 'no-ack') {
    addMsg('err', '对方没有确认，这一条可能没送达（可以再发一次）', '', false);
    el.dot.className = 'dot err';
  }
}

/* ============================ 设备身份 ============================ */

function randomId() {
  return 1 + Math.floor(Math.random() * 254);
}

function initIdentity() {
  // 优先用本 tab 的临时覆盖（说明这个 tab 之前让过位），否则用持久身份
  let id = parseInt(sessGet('sc.id.tab', '0'), 10);
  if (!id || id < 1 || id > 254) id = parseInt(localGet('sc.id', '0'), 10);
  if (!id || id < 1 || id > 254) {
    id = randomId();
    localSet('sc.id', String(id));
  }
  state.myId = id;
  state.myName = localGet('sc.name', '') || `设备${id}`;

  // tab 内随机数：ID 撞车时用来裁决谁让位（协议层比较，大的让位）
  let nonce = parseInt(sessGet('sc.nonce', '0'), 10);
  if (!nonce) {
    nonce = (Math.random() * 0xffffffff) >>> 0;
    sessSet('sc.nonce', String(nonce));
  }
  state.nonce = nonce;
  if (el.meText) el.meText.textContent = `我：${state.myName}`;
}

/* ============================ 音频 ============================ */

/** 归一化信号强度，用于电平表与载波侦听 */
function normLevel() {
  const rx = state.rx;
  if (!rx) return 0;
  return rx.level / ((rx.winLen * rx.winLen) / 4);
}

async function startAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  state.ctx = new AC({ latencyHint: 'interactive' });
  if (state.ctx.state === 'suspended') await state.ctx.resume();

  // 关键：必须关掉 AGC / 降噪 / 回声消除，否则浏览器会把我们的载波当噪声处理掉
  state.stream = await navigator.mediaDevices.getUserMedia({
    audio: {
      echoCancellation: false,
      noiseSuppression: false,
      autoGainControl: false,
      channelCount: 1,
    },
  });

  const src = state.ctx.createMediaStreamSource(state.stream);
  const gain = state.ctx.createGain();
  gain.gain.value = MIC_GAIN;
  // ScriptProcessor 已废弃但兼容性最好（含 iOS Safari），且不需要额外文件
  const proc = state.ctx.createScriptProcessor(4096, 1, 1);
  src.connect(gain);
  gain.connect(proc);
  proc.connect(state.ctx.destination); // 不连出去某些浏览器不回调
  gain.gain.value = MIC_GAIN;
  proc.onaudioprocess = onAudio;
  return state.ctx.sampleRate;
}

const now2 = () => Date.now();

function onAudio(e) {
  if (state.txActive || !state.rx) return;
  const input = e.inputBuffer.getChannelData(0);
  const chunk = new Float32Array(input.length);
  chunk.set(input);
  const frames = state.rx.push(chunk);
  for (const f of frames) state.session.onFrame(f);

  // 载波侦听：对端在发就让行（自己发声期间不会走到这里）
  state.session.setCarrierBusy(normLevel() > CARRIER_THRESHOLD);

  // 电平表
  const raw = normLevel();
  const lv = Math.min(1, raw / 0.7);
  if (raw > 0.95 && now2() - state.lastClipWarn > 8000) {
    state.lastClipWarn = now2();
    addLog('warn', '输入电平接近满幅，可能削波失真；同机双开时请把音量调小一些');
  }
  el.meterFill.style.width = `${(lv * 100).toFixed(0)}%`;
  el.meterFill.style.background = lv > 0.5 ? 'var(--accent)' : 'var(--ok)';

  const now = Date.now();
  if (now - state.lastTick > 1000) {
    state.lastTick = now;
    state.session.tick(now);
  }
}

/** 播放一帧波形，播完 resolve */
function transmit(bytes) {
  const ctx = state.ctx;
  const profile = PROFILES[state.profileKey];
  const wav = modulate(bytes, profile, ctx.sampleRate);
  const buf = ctx.createBuffer(1, wav.length, ctx.sampleRate);
  buf.copyToChannel(wav, 0);
  const node = ctx.createBufferSource();
  node.buffer = buf;
  node.connect(ctx.destination);
  state.txActive = true;
  return new Promise((resolve) => {
    node.onended = () => {
      state.txActive = false;
      // 丢掉自己发声期间录到的内容，避免解到自己的声音
      if (state.rx) state.rx.reset();
      resolve();
    };
    node.start();
  });
}

/* ============================ 启动 ============================ */

// 身份与档位选择不依赖音频权限，页面一加载就准备好，
// 这样用户点「开始监听」时不会再因为初始化顺序出问题。
initIdentity();
buildProfileSelect();

function buildProfileSelect() {
  el.profile.innerHTML = '';
  for (const key of Object.keys(PROFILES)) {
    const p = PROFILES[key];
    const o = document.createElement('option');
    o.value = key;
    o.textContent = `${p.label}档`;
    el.profile.appendChild(o);
  }
  el.profile.value = state.profileKey;
  updateRateText();
}

function updateRateText() {
  const p = PROFILES[state.profileKey];
  const fs = state.ctx ? state.ctx.sampleRate : 48000;
  const sps = samplesPerSymbol(p, fs);
  const dur = frameDuration(p, buildFrame({ type: FRAME.MSG, payload: new Uint8Array(60) }));
  el.rateText.textContent = `${p.symbolMs.toFixed(1)}ms/符号 · 60字节约 ${dur.toFixed(1)}s · ${fs}Hz`;
}

async function boot() {
  const fs = await startAudio();
  state.rx = new AcousticReceiver(PROFILES[state.profileKey], fs);
  updateRateText();
  addLog('ok', `音频就绪：${fs}Hz，本机 id=${state.myId} 昵称=${state.myName}`);

  state.session = new ChatSession({
    myId: state.myId,
    myName: state.myName,
    transmit,
    opts: { profileKey: state.profileKey },
    onMessage: (m) => addMsg('peer', m.text, `${m.from} · ${fmtTime(m.at)}`),
    onPeer: (p) => {
      el.peerText.textContent = `已配对：${p.name}`;
      addMsg('sys', `已与「${p.name}」建立声波连接`);
    },
    onStatus: setStatus,
    onLog: (e) => addLog(e.level, e.text),
    onIdCollision: () => {
      // 协议层已经裁决过：走到这里说明本 tab 的 nonce 更大，由本 tab 让位。
      // 只写 sessionStorage 覆盖，不动 localStorage 的持久身份 ——
      // 否则会把另一个 tab（以及将来的会话）的身份一起改掉。
      const old = state.myId;
      let id = randomId();
      while (id === old) id = randomId();
      state.myId = id;
      state.myName = `设备${id}`;
      sessSet('sc.id.tab', String(id));
      if (el.meText) el.meText.textContent = `我：${state.myName}`;
      state.session.setId(id);
      addLog('warn', `设备 ID 与另一个窗口撞车，本 tab 临时改用「${state.myName}」（持久身份仍是设备${old}）`);
      addMsg('sys', `检测到另一个窗口也叫「设备${old}」，本窗口临时改名为「${state.myName}」`, '', false);
      state.session.pair();
    },
  });

  state.session.start();
  el.overlay.classList.add('hide');

  const hist = loadHistory();
  if (hist.length) {
    for (const e of hist) renderMsg(e.k, e.t, e.m);
    addMsg('sys', `已恢复 ${hist.length} 条本机聊天记录`, '', false);
  }
  addMsg('sys', '开始监听。把两台设备放在同一房间，点「配对」或直接发消息。', '', false);
  el.text.focus();
}

/* ============================ 自检 / 导出 ============================ */

function selfTest() {
  const p = PROFILES[state.profileKey];
  const fs = state.ctx ? state.ctx.sampleRate : 48000;
  // 先把结果清掉并给出"正在跑"的反馈：遮罩挡着聊天区、日志面板默认隐藏，
  // 结果只写那两处的话用户点完会以为没反应（这就是之前的 bug）。
  el.selfTestResult.className = '';
  el.selfTestResult.textContent = '自检中…';
  const text = '自检：声波链路正常 123';
  const bytes = buildFrame({ type: FRAME.MSG, seq: 1, src: 1, dst: 2, payload: textToBytes(text) });
  const wav = modulate(bytes, p, fs);
  const rx = new AcousticReceiver(p, fs);
  const t0 = performance.now();
  const out = [];
  for (let i = 0; i < wav.length; i += 960) {
    for (const f of rx.push(wav.subarray(i, Math.min(i + 960, wav.length)))) out.push(f);
  }
  for (const f of rx.flush()) out.push(f);
  const ms = (performance.now() - t0).toFixed(0);
  const ok = out.length === 1 && bytesToText(out[0].payload) === text;
  const detail = ok
    ? `✓ 自检通过 · ${p.label}档 · ${wav.length} 采样 · 解码 ${ms}ms`
    : `✗ 自检失败 · ${p.label}档 · 解出 ${out.length} 帧（应为 1 帧），请点「日志」看细节`;
  el.selfTestResult.className = ok ? 'ok' : 'err';
  el.selfTestResult.textContent = detail;
  addLog(ok ? 'ok' : 'error', `自检 ${ok ? '通过' : '失败'}：${p.label}档，${wav.length} 采样，解码耗时 ${ms}ms`);
  addMsg(ok ? 'sys' : 'err', detail, '', false);
}

function exportWav() {
  const p = PROFILES[state.profileKey];
  const fs = state.ctx ? state.ctx.sampleRate : 48000;
  const text = el.text.value.trim() || '声波聊天测试';
  const bytes = buildFrame({ type: FRAME.MSG, seq: 1, src: state.myId, dst: 0, payload: textToBytes(text) });
  const wav = modulate(bytes, p, fs);
  const buf = new ArrayBuffer(44 + wav.length * 2);
  const dv = new DataView(buf);
  const wstr = (o, s) => {
    for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i));
  };
  wstr(0, 'RIFF');
  dv.setUint32(4, 36 + wav.length * 2, true);
  wstr(8, 'WAVE');
  wstr(12, 'fmt ');
  dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true);
  dv.setUint16(22, 1, true);
  dv.setUint32(24, fs, true);
  dv.setUint32(28, fs * 2, true);
  dv.setUint16(32, 2, true);
  dv.setUint16(34, 16, true);
  wstr(36, 'data');
  dv.setUint32(40, wav.length * 2, true);
  for (let i = 0; i < wav.length; i++) {
    dv.setInt16(44 + i * 2, Math.max(-1, Math.min(1, wav[i])) * 32767, true);
  }
  const url = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'soundchat.wav';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  addLog('ok', `已导出 ${a.download}（${(wav.length / fs).toFixed(2)}s），可用另一台设备外放试听`);
}

/* ============================ 事件 ============================ */

function doSend() {
  const text = el.text.value.trim();
  if (!text) return;
  if (!state.session) {
    addMsg('err', '请先点「开始监听」');
    return;
  }
  const r = state.session.say(text);
  if (!r.ok) {
    addMsg('err', r.reason === 'too-long' ? '文字太长了，请分段发送' : '不能发送空消息');
    return;
  }
  addMsg('me', text, `我 · ${fmtTime(Date.now())}${r.chunks > 1 ? ` · 分 ${r.chunks} 帧` : ''}`);
  el.text.value = '';
  el.text.style.height = 'auto';
}

el.btnStart.addEventListener('click', () => {
  boot().catch((e) => {
    addLog('error', `启动失败：${e.message}`);
    alert(`启动失败：${e.message}\n\n如果是麦克风权限问题，请确认页面是通过 https:// 或 localhost 打开的。`);
  });
});

el.send.addEventListener('click', doSend);

el.text.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    doSend();
  }
});
el.text.addEventListener('input', () => {
  el.text.style.height = 'auto';
  el.text.style.height = `${Math.min(120, el.text.scrollHeight)}px`;
});

el.profile.addEventListener('change', () => {
  state.profileKey = el.profile.value;
  localSet('sc.profile', state.profileKey);
  const fs = state.ctx ? state.ctx.sampleRate : 48000;
  if (state.rx) state.rx = new AcousticReceiver(PROFILES[state.profileKey], fs);
  if (state.session) state.session.profileKey = state.profileKey;
  updateRateText();
  addLog('info', `切换到 ${PROFILES[state.profileKey].label}档（两端必须用同一档位）`);
  addMsg('sys', `已切换到「${PROFILES[state.profileKey].label}」档，对方也要切到同一档`);
});

el.btnPair.addEventListener('click', () => {
  if (!state.session) {
    addMsg('err', '请先点「开始监听」');
    return;
  }
  state.session.pair();
});

el.btnLog.addEventListener('click', () => {
  el.logPanel.classList.toggle('show');
});

el.btnClear.addEventListener('click', () => {
  if (!confirm('清空本机保存的聊天记录？\n（只影响这台设备的浏览器本地记录，不影响对方）')) return;
  clearHistory();
  el.chat.innerHTML = '';
  addMsg('sys', '聊天记录已清空', '', false);
});

el.btnSelfTest.addEventListener('click', selfTest);
el.btnWav.addEventListener('click', exportWav);

// 供调试用
window.__soundchat = state;

// 自动化验证入口：?selftest=1 时页面加载后自动跑一次自检，并把结果写进 DOM，
// 这样可以用无头 Chrome --dump-dom 做冒烟测试。
if (new URLSearchParams(location.search).has('selftest')) {
  setTimeout(() => {
    try {
      selfTest();
      const d = document.createElement('div');
      d.id = 'selftest-result';
      d.textContent = el.logPanel.lastElementChild ? el.logPanel.lastElementChild.textContent : 'no-result';
      document.body.appendChild(d);
    } catch (e) {
      const d = document.createElement('div');
      d.id = 'selftest-result';
      d.textContent = 'THREW: ' + e.message;
      document.body.appendChild(d);
    }
  }, 60);
}

})();
</script>
