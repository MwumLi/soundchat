name: Release

# 推 v* tag 时自动发布：跑测试 → 构建单文件 → 建 Release 并附上产物。
# 另外留了 workflow_dispatch，用于给「工作流存在之前就已经打好的 tag」补发。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（例如 v0.2.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 发布前必须测试通过
        run: npm test

      - name: 校验 package.json 版本与 tag 一致
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER=$(node -p "require('./package.json').version")
          if [ "v$VER" != "$TAG" ]; then
            echo "::error::package.json 是 v$VER，但 tag 是 $TAG —— 版本号必须先对齐再发布"
            exit 1
          fi
          echo "版本校验通过：$TAG"

      - name: 构建单文件产物
        run: |
          node build.mjs
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          cp dist/soundchat.html "soundchat-${TAG}.html"
          echo "产物："
          ls -lh soundchat-*.html

      - name: 校验产物里的构建标识与 tag 一致
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          STAMP=$(grep -o 'window.__BUILD__ = {[^}]*}' "soundchat-${TAG}.html")
          echo "构建标识：$STAMP"
          case "$STAMP" in
            *"\"version\":\"${TAG#v}\""*) echo "标识与 tag 一致" ;;
            *) echo "::error::产物版本与 tag 不一致"; exit 1 ;;
          esac

      - name: 创建 Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" "soundchat-${TAG}.html" \
            --title "SoundChat $TAG" \
            --generate-notes \
            --verify-tag
